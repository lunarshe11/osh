<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9MAYA Casino - Вход</title>
    <link rel="stylesheet" href="cjs/style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>9MAYA</h1>
            <p>CASINO</p>
        </div>
        
        <div class="disclaimer">
            ⚠️ ВНИМАНИЕ: ЭТО ФЕЙК. Все деньги виртуальные. Никаких реальных ставок.
        </div>

        <div class="balance-card">
            <p class="balance-label">Твой баланс:</p>
            <div class="balance-amount" id="balance">100 Ꚛ</div>
        </div>

        <button class="play-btn" id="playBtn">
            🎰 ИГРАТЬ
        </button>

        <div class="footer">
            <p>© lunarshe11</p>
        </div>
    </div>

    <script>
        const SUFFIXES = ['', 'k', 'm', 'b', 't', 'q', 'Q', 's', 'o', 'n', 'd', 'U', 'D', 'T', 'qd', 'Qn', 'Sx', 'Sp', 'Oc', 'No', 'V'];
        function formatNumber(num) {
            if (num === undefined || num === null || isNaN(num)) return '0';
            if (num === 0) return '0';
            let sign = '';
            if (num < 0) { sign = '-'; num = -num; }
            let index = 0;
            while (num >= 1000 && index < SUFFIXES.length - 1) {
                num /= 1000;
                index++;
            }
            let formatted = (num % 1 === 0) ? num.toFixed(0) : num.toFixed(1);
            if (parseFloat(formatted) >= 1000 && index < SUFFIXES.length - 1) {
                num = parseFloat(formatted) / 1000;
                index++;
                formatted = (num % 1 === 0) ? num.toFixed(0) : num.toFixed(1);
            }
            return sign + formatted + SUFFIXES[index];
        }

        const balance = parseInt(localStorage.getItem('maya_balance')) || 100;
        document.getElementById('balance').textContent = formatNumber(balance) + ' Ꚛ';
        
        document.getElementById('playBtn').addEventListener('click', () => {
            window.location.href = 'game.html';
        });
    </script>
</body>
</html>
